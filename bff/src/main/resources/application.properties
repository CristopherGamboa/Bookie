spring.application.name=bff

# Configuración de Azure Functions (FaaS) - REST (Usuarios)
# Se puede override con variable de entorno: FAAS_USER_URL
faas.user.url=${FAAS_USER_URL:https://bookie-functions.azurewebsites.net/api/users}

# Configuración de Azure Functions (FaaS) - GraphQL (Préstamos)
# Se pueden override con variables de entorno: FAAS_GRAPHQL_QUERY_URL, FAAS_GRAPHQL_MUTATION_URL
faas.graphql.query.url=${FAAS_GRAPHQL_QUERY_URL:https://bookie-functions.azurewebsites.net/api/graphql/loans/query}
faas.graphql.mutation.url=${FAAS_GRAPHQL_MUTATION_URL:https://bookie-functions.azurewebsites.net/api/graphql/loans/mutation}

# Configuración de Datasource (Opcional - para futuro uso directo de BD)
# Se pueden override con variables de entorno: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@localhost:1521:xe}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bookie_admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Admin1.}
spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver

# Configuración de logging
logging.level.root=INFO
logging.level.duoc.bff=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.http=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Configuración de Jackson para omitir campos null en la serialización JSON
spring.jackson.default-property-inclusion=non_null
